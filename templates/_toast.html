<!-- ─── Toast Albion Glass (tarea 6/9) ──────────────────────────
     Aviso transitorio que aparece abajo y se va solo. API:
     window.toast.info('mensaje');
     window.toast.ok('mensaje');
     window.toast.error('mensaje'); -->
<div id="toast-contenedor" class="toast-contenedor" aria-live="polite" aria-atomic="false"></div>

<style>
  .toast-contenedor {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 420px;
  }
  .toast-item {
    pointer-events: auto;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--texto-suave);
    background: rgba(26, 20, 16, .92);
    border: 1px solid rgba(201, 162, 86, .40);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .40),
                0 0 0 1px rgba(0, 0, 0, .30);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    animation: toast-entrar .2s ease-out;
  }
  @keyframes toast-entrar {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .toast-item.toast-saliendo { animation: toast-salir .18s ease-in forwards; }
  @keyframes toast-salir {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(6px); }
  }
  .toast-icono { flex-shrink: 0; margin-top: 1px; }
  .toast-info  .toast-icono { color: var(--oro-claro); }
  .toast-ok    .toast-icono { color: var(--ok); }
  .toast-error .toast-icono { color: var(--peligro); }
  .toast-ok    { border-color: rgba(122, 184, 142, .45); }
  .toast-error { border-color: rgba(212, 138, 122, .45); }
  .toast-cerrar {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--texto-suave);
    cursor: pointer;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .toast-cerrar:hover { color: #fff; background: rgba(255, 255, 255, .06); }
  .toast-cerrar:focus-visible { outline: 2px solid var(--oro-claro); outline-offset: 1px; }
  .toast-mensaje { flex: 1; padding-top: 3px; display: block; }
  @media (prefers-reduced-motion: reduce) {
    .toast-item, .toast-item.toast-saliendo { animation: none; }
  }
</style>

<script>
window.toast = (function () {
  var PAUSA_HOVER = true;
  function icono(tipo) {
    var paths = {
      info:  '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      ok:    '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      error: '<circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
    };
    return '<svg class="toast-icono" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[tipo] + '</svg>';
  }
  function mostrar(tipo, mensaje, duracion) {
    var cont = document.getElementById('toast-contenedor');
    if (!cont) return;
    var item = document.createElement('div');
    item.className = 'toast-item toast-' + tipo;
    item.setAttribute('role', 'status');
    var boton = document.createElement('button');
    boton.type = 'button';
    boton.className = 'toast-cerrar';
    boton.setAttribute('aria-label', 'Cerrar aviso');
    boton.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>';
    item.innerHTML = icono(tipo) + '<span class="toast-mensaje"></span>';
    item.querySelector('.toast-mensaje').textContent = mensaje;
    item.appendChild(boton);
    cont.appendChild(item);
    var muerto = false;
    function quitar() {
      if (muerto) return;
      muerto = true;
      item.classList.add('toast-saliendo');
      setTimeout(function () { if (item.parentNode) item.parentNode.removeChild(item); }, 200);
    }
    boton.addEventListener('click', quitar);
    var t = setTimeout(quitar, duracion || 3500);
    if (PAUSA_HOVER) {
      item.addEventListener('mouseenter', function () { clearTimeout(t); });
      item.addEventListener('mouseleave', function () { t = setTimeout(quitar, duracion || 3500); });
    }
  }
  return {
    info:  function (m) { mostrar('info', m); },
    ok:    function (m) { mostrar('ok', m); },
    error: function (m) { mostrar('error', m, 5000); }
  };
})();
</script>
