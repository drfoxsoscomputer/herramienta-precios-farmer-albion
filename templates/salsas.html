{% extends "base.html" %}
{% block titulo %}Salsas{% endblock %}
{% block contenido %}

<div class="flex items-center gap-3 mb-2">
  <a href="/" class="text-zinc-400 hover:text-white transition-colors">← Volver a Inicio</a>
</div>

<h1 class="text-3xl font-bold titulo-oro" style="font-family:'Cinzel',Georgia,serif">Salsas de pescado</h1>
<p class="text-zinc-500 mt-2 mb-6">{{ resena }}</p>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
  {% for s in salsas %}
  <a href="/salsas/{{ s.nombre | urlencode }}"
     class="bg-panel border border-borde rounded-xl p-4 flex items-center gap-3 card-hover">
    <img src="{{ s.icono }}" alt="{{ s.nombre }}" class="w-10 h-10 object-contain"
         onerror="this.style.display='none'">
    <div class="min-w-0 flex-1">
      <div class="font-semibold truncate" style="color:{{ s.color }}">{{ s.nombre }}</div>
      <div class="text-xs text-zinc-500">{{ s.receta }}</div>
    </div>
    <span class="text-xs font-bold px-2 py-1 rounded-full border shrink-0"
          style="color:{{ s.color }}; border-color:{{ s.color }}">L{{ s.nivel }}</span>
  </a>
  {% endfor %}
</div>

{% endblock %}
