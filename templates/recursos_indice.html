{% extends "base.html" %}
{% block titulo %}Recursos{% endblock %}
{% block contenido %}

<div class="flex items-center gap-3 mb-2">
  <a href="/" class="text-zinc-400 hover:text-white transition-colors">← Volver a Inicio</a>
</div>

<h1 class="text-3xl font-bold titulo-oro" style="font-family:'Cinzel',Georgia,serif">Recursos</h1>
<p class="text-zinc-500 mt-2 mb-6">{{ resena }}</p>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
  {% for r in recursos %}
  <a href="/recursos/{{ r.tipo }}"
     class="bg-panel border border-borde rounded-xl p-4 flex items-center gap-3 card-hover">
    <div class="item-marco rounded-md p-1.5 shrink-0">
      <img src="https://render.albiononline.com/v1/item/T2_{{ r.tipo | upper }}.png"
           alt="{{ r.par }}" class="w-10 h-10 object-contain"
           onerror="this.style.display='none'">
    </div>
    <div class="min-w-0 flex-1">
      <div class="font-semibold truncate">{{ r.par }}</div>
      <div class="text-xs texto-atenuado truncate">{{ r.nombre }}</div>
    </div>
    <span class="text-xs font-bold px-2 py-1 rounded-full border shrink-0"
          style="color:{{ r.color }}; border-color:{{ r.color }}">T2+</span>
  </a>
  {% endfor %}
</div>

{% endblock %}
