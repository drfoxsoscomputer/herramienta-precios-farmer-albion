<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion Helper · Inicio</title>
<style>
@font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 400;
  font-display: swap;
  src: url('/static/fonts/Cinzel-400.woff2') format('woff2'); }
@font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 700;
  font-display: swap;
  src: url('/static/fonts/Cinzel-700.woff2') format('woff2'); }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: {
    oro:   { DEFAULT: '#c9a256', claro: '#e8b84a', brillo: '#f5d576' },
    bronce: '#8a6a3a',
    ambar:  '#e8a545',
    fondo: '#1a1410',
    panel: '#241c16',
    borde: '#3a2a24',
  } } },
};
</script>
<style>
  body { background: radial-gradient(900px 620px at 50% -80px,
           #3a2a35 0%, #1a1410 62%); }
  .titulo-oro {
    background: linear-gradient(180deg, #f5d576 0%, #e8b84a 55%, #c9a256 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #e8b84a;
    text-shadow: 0 0 18px rgba(232, 181, 74, .18);
  }
  .btn-modo {
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease,
                background-color .15s ease;
  }
  .btn-modo:hover {
    transform: translateY(-2px);
    border-color: #c9a256 !important;
    box-shadow: 0 4px 22px rgba(232, 165, 69, .15);
    background-color: #2e251c;
  }
  .btn-modo:active { transform: translateY(0); }
</style>
</head>
<body class="bg-fondo text-white min-h-screen antialiased flex flex-col items-center justify-center px-4">

  <div class="text-5xl mb-2" title="Albion Helper">🎮</div>
  <h1 class="text-3xl font-bold titulo-oro text-center" style="font-family:'Cinzel',Georgia,serif">
    Albion Helper
  </h1>
  <p class="text-zinc-400 text-sm mt-1 mb-5">¿Qué querés hacer?</p>

  <div class="w-full max-w-sm space-y-3">

    <button onclick="elegir('app')"
            class="btn-modo w-full flex items-center gap-4 bg-panel border border-borde rounded-xl px-5 py-4 text-left cursor-pointer">
      <span class="text-3xl">🖥️</span>
      <span>
        <span class="block font-bold text-lg">Abrir la app</span>
        <span class="block text-sm text-zinc-400">Ventana completa con todo el mercado</span>
      </span>
    </button>

    <button onclick="elegir('solo')"
            class="btn-modo w-full flex items-center gap-4 bg-panel border border-borde rounded-xl px-5 py-4 text-left cursor-pointer">
      <span class="text-3xl">📱</span>
      <span>
        <span class="block font-bold text-lg">Solo servidor</span>
        <span class="block text-sm text-zinc-400">QR para el celular · se oculta a la bandeja</span>
      </span>
    </button>

    <button onclick="elegir('consola')"
            class="btn-modo w-full flex items-center gap-4 bg-panel border border-borde rounded-xl px-5 py-4 text-left cursor-pointer">
      <span class="text-3xl">⌨️</span>
      <span>
        <span class="block font-bold text-lg">Consola</span>
        <span class="block text-sm text-zinc-400">Herramienta de precios en la terminal</span>
      </span>
    </button>

  </div>

  <div class="text-xs text-zinc-500 mt-6 text-center">
    Servidor web activo en el puerto 8081 · v{{ version }}
  </div>

<script>
function elegir(modo) {
  if (!window.pywebview || !window.pywebview.api) return;
  if (modo === 'app')    window.pywebview.api.abrir_app();
  if (modo === 'solo')   window.pywebview.api.solo_servidor();
  if (modo === 'consola') window.pywebview.api.abrir_consola();
}
</script>

</body>
</html>
