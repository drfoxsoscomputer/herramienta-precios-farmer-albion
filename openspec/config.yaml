# openspec/config.yaml — SDD config for albion
schema: spec-driven

context: |
  Tech stack: Python 3 + Rich — console helper for Albion Online (market prices from
    albion-online-data.com). Windows VT terminal, run with `python -X utf8 albion_helper.py`.
  Architecture: single-package CLI. albion_helper.py (entry) -> menus.py (all UI, arrow
    selector, tier colors, no-flicker diff renderer), constants.py, api.py (60s cache +
    429 backoff), formatting.py (pure helpers), textos.py, albion_config.json (data).
  Testing: no pytest installed. Verification via inline batteries in tests/
    (tests/regression_fase2.py, 12 sections; tests/test_api_cache.py, 4 tests).
    Both pass with `python -X utf8` from repo cwd.
  Style: UI in neutral Spanish (user is Venezuelan, no voseo); identifiers without
    accents; generated artifacts default to English.
  User: Python beginner — every phase must teach with clear explanations. Do NOT install
    anything new (no pip installs).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Explain concepts at a beginner-friendly level
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: "python -X utf8 tests/regression_fase2.py && python -X utf8 tests/test_api_cache.py && python -X utf8 tests/test_recursos_t8.py && python -X utf8 tests/test_market_summary.py"
  verify:
    test_command: "python -X utf8 tests/regression_fase2.py && python -X utf8 tests/test_api_cache.py && python -X utf8 tests/test_recursos_t8.py && python -X utf8 tests/test_market_summary.py"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
